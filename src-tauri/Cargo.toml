[package]
name = "collection-tracker"
version = "0.1.0"
description = "A library-style shelf for books, vinyl, CDs, games and Blu-rays"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
base64 = "0.22"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
